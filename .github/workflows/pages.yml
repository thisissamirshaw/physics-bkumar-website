# Free hosting on GitHub Pages: builds the site as plain files.
# Page content comes from frontend/public/content.json (download a fresh one from the console:
# Backup & restore), unless the API_URL variable below points this copy at a live server.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build
        working-directory: frontend
        env:
          VITE_STATIC: '1'
          # Optional repository variable (Settings → Secrets and variables → Actions → Variables):
          # the address of the hosted server, e.g. https://physics-bkumar.onrender.com. When set,
          # this copy reads live content from it, sends enquiries to it and includes /admin.
          VITE_API_URL: ${{ vars.API_URL }}
        run: |
          npm ci --no-audit --no-fund
          npx tsc -b
          npx vite build --base=/${{ github.event.repository.name }}/
          cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - id: deployment
        uses: actions/deploy-pages@v4
