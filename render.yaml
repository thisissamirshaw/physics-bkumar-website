# Render Blueprint: free web service. Data lives in an external Postgres (e.g. Neon free tier),
# because Render's free disk is wiped on every restart.
services:
  - type: web
    name: physics-bkumar
    runtime: docker
    plan: free
    healthCheckPath: /api/content
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      # Optional: the super admin's first email and password. Left unset, the account starts as
      # superadmin@example.com / 12345678 and is changed from the console (Account & security).
      # - key: SUPERADMIN_EMAIL
      #   sync: false
      # - key: SUPERADMIN_PASSWORD
      #   sync: false
      - key: DATABASE_URL
        sync: false
